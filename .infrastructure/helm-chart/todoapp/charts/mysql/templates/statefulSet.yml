apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.common.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  replicas: {{ .Values.stateful_set.replicas }}
  serviceName: {{ .Chart.Name }}-service
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: {{ .Values.image.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.version }}
          env:
          {{- range $k, $v := .Values.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Chart.Name }}-secrets
                  key: {{ $k }}
          {{- end}}
            - name: MYSQL_DATABASE
              value: app_db
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: config-map
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            exec:
              command: [ "mysqladmin", "ping" ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [ "mysqladmin", "ping" ]
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
      volumes:
        - name: config-map
          configMap:
            name: {{ .Chart.Name }}-config
      tolerations:
        - key: {{ .Values.tolerations.key }}
          operator: {{ .Values.tolerations.operator }}
          value: {{ .Values.tolerations.value }}
          effect: {{ .Values.tolerations.effect }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: {{ .Values.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.key }}
                    operator: {{ .Values.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.operator }}
                    values:
                    {{- range .Values.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.values }}
                      - {{ . }}
                    {{- end }}
              topologyKey: {{ .Values.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.topologyKey }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.key }}
                    operator: {{ .Values.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.operator }}
                    values:
                    {{- range .Values.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.values }}
                      - {{ . }}
                    {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.pvc.resources.requests.storage }}
