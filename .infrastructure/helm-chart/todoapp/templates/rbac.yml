kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ .Values.todoapp.rbac.service_account.name }}
  namespace: {{ .Values.common.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.common.namespace }}
  name: {{ .Values.todoapp.rbac.role.name }}
rules:
  - apiGroups: [ "" ]
    resources:
    {{- range .Values.todoapp.rbac.role.resources }}
      - {{ . | quote }}
    {{- end }}
    verbs:
    {{- range .Values.todoapp.rbac.role.verbs}}
      - {{ . | quote }}
    {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.todoapp.rbac.role_binding.name }}
  namespace: {{ .Values.common.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.todoapp.rbac.service_account.name }}
roleRef:
  kind: Role
  name: {{ .Values.todoapp.rbac.role.name }}
  apiGroup: rbac.authorization.k8s.io